version: "3.9"

# Docker Compose Override for Demo/Development Environment
# Automatically loaded by `docker compose up` when present
# For demo mode: ENVIRONMENT=demo in .env file

services:
  # Ollama LLM Server (Local AI for demo mode)
  # Qwen3 4B fits perfectly on RX 6500 XT 8GB + 16GB RAM
  ollama:
    image: ollama/ollama:latest
    container_name: pytomatiza-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - pytomatiza-net
    restart: unless-stopped

  # Local PostgreSQL for demo/development
  postgres:
    image: postgres:16-alpine
    container_name: pytomatiza-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: Pytomatiza
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pytomatiza-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Pytomatiza"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local Redis for demo/development
  redis:
    image: redis:7-alpine
    container_name: pytomatiza-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis
    volumes:
      - redis_data:/data
    networks:
      - pytomatiza-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  ollama_data:
  postgres_data:
  redis_data:

networks:
  pytomatiza-net:
    driver: bridge